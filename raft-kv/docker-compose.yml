version: "3.9"

x-peers: &peers "node1=node1:8001,node2=node2:8002,node3=node3:8003"

services:
  node1:
    build: .
    container_name: node1
    hostname: node1
    command: ["-id=node1", "-addr=:8001", "-peers=node1=node1:8001,node2=node2:8002,node3=node3:8003"]
    ports:
      - "8001:8001"
    networks: [raftnet]

  node2:
    build: .
    container_name: node2
    hostname: node2
    command: ["-id=node2", "-addr=:8002", "-peers=node1=node1:8001,node2=node2:8002,node3=node3:8003"]
    ports:
      - "8002:8002"
    networks: [raftnet]

  node3:
    build: .
    container_name: node3
    hostname: node3
    command: ["-id=node3", "-addr=:8003", "-peers=node1=node1:8001,node2=node2:8002,node3=node3:8003"]
    ports:
      - "8003:8003"
    networks: [raftnet]

networks:
  raftnet:
    driver: bridge
